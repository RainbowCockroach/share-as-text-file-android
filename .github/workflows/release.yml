name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes a running release; the next run cleans up anything half-done
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test, lint and build
        run: ./gradlew test lint assembleRelease -PversionCode=${{ github.run_number }} -PversionName=$VERSION_NAME

      - name: Publish release and remove older ones
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION_NAME"
          APK="share-as-text-file-$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Share as Text File $VERSION_NAME" \
            --notes "Built from ${GITHUB_SHA::7}. Download the APK below and open it on your phone to install." \
            --latest
          gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | grep -vx "$TAG" \
            | xargs -r -n1 gh release delete --yes --cleanup-tag
